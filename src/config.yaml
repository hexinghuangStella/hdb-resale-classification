data_path: data/data.csv
output_dir: artifacts
split:
  validation_size: 0.1
  test_size: 0.1
  random_state: 42
cross_validation:
  folds: 5
models:
  logistic_regression:
    type: logistic_regression
    params:
      C: 1.0
      max_iter: 1000
      solver: liblinear
  decision_tree:
    type: decision_tree
    # Historical notebook parameters, not re-tuned for the current feature set.
    # Strip classifier__ because params are passed directly to the classifier.
    params:
      criterion: gini
      max_depth: 20
      min_samples_split: 50
      min_samples_leaf: 10
